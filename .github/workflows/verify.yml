name: Verify
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - name: Install pinned Android SDK packages
        run: yes | sdkmanager "platforms;android-37.0" "build-tools;37.0.0" >/dev/null
      - run: ./gradlew --no-daemon check bddTest assembleDebug

